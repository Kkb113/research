[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vesuvius-exact-fiber-evidence"
version = "0.1.0"
description = "Exact-output, resource-conscious Vesuvius fiber preprocessing"
requires-python = ">=3.13"
dependencies = ["numpy==2.3.5", "numcodecs==0.16.5", "requests==2.32.5"]
[project.scripts]
vesuvius-fiber-patch = "evidence_pipeline.integrate:main"
[tool.setuptools.packages.find]
include = ["evidence_pipeline*"]
